<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What does accuracy cost?</title>
<link rel="stylesheet" href="_engine.css">
</head>
<body>
<div id="sim"></div>
<script src="_engine.js"></script>
<script>
/* Three measured Qwen2.5 models. Sizes and accuracy from
   lab/out/lab4_size_ladder.json (size_fp16_gb, rotation_accuracy); energy
   from lab/out/theme_s_energy.json (j_per_token, wh_per_1k_tokens).
   Idle board power 13.8 W, GPU power limit 55 W. */
var MODELS = [
  { name: '0.5B', gb: 0.99, acc: 15, j: 0.767, wh: 0.213 },
  { name: '1.5B', gb: 3.09, acc: 70, j: 1.133, wh: 0.315 },
  { name: '3B',   gb: 6.17, acc: 95, j: 1.941, wh: 0.539 }
];

/* Index of the largest model whose FP16 weights fit in v gigabytes, or -1. */
function fits(v) {
  var k = -1;
  for (var i = 0; i < MODELS.length; i++) { if (MODELS[i].gb <= v) { k = i; } }
  return k;
}

Sim.mount({
  type: 'sliders',
  title: {
    en: 'What does accuracy cost?',
    es: 'Cuanto cuesta la exactitud?'
  },
  ariaLabel: {
    en: 'Accuracy against model size for three measured models, with a VRAM budget you set',
    es: 'Exactitud contra tamano del modelo para tres modelos medidos, con un presupuesto de VRAM que tu eliges'
  },
  points: MODELS.map(function (m) { return { x: m.gb, y: m.acc }; }),
  xRange: [0, 8],
  yRange: [0, 105],
  xLabel: { en: 'model size in GB (FP16 weights)', es: 'tamano del modelo en GB (pesos FP16)' },
  yLabel: { en: 'accuracy (%)', es: 'exactitud (%)' },
  params: [
    { id: 'vram', label: { en: 'VRAM your machine has', es: 'VRAM que tiene tu maquina' },
      min: 0.5, max: 8, step: 0.25, value: 4, digits: 2, unit: ' GB' }
  ],
  curves: [
    /* The staircase: best accuracy any budget of x GB can reach. */
    { fn: function (p, x) { var k = fits(x); return k < 0 ? NaN : MODELS[k].acc; },
      accent: 1, width: 3 },
    /* Your ceiling at the current slider setting. */
    { fn: function (p) { var k = fits(p.vram); return k < 0 ? NaN : MODELS[k].acc; },
      accent: 2, width: 2, dash: [6, 4] }
  ],
  bands: [
    /* Everything your machine can load. */
    { lo: function () { return 0; },
      hi: function (p, x) { return x <= p.vram ? 105 : 0; },
      accent: 1, alpha: 0.12 }
  ],
  readouts: [
    { id: 'n', label: { en: 'Models that fit', es: 'Modelos que caben' }, accent: 1,
      compute: function (p) { return (fits(p.vram) + 1) + ' / 3'; } },
    { id: 'which', label: { en: 'Largest that fits', es: 'El mayor que cabe' },
      compute: function (p) { var k = fits(p.vram); return k < 0 ? '--' : MODELS[k].name; } },
    { id: 'acc', label: { en: 'Best accuracy', es: 'Mejor exactitud' }, accent: 1,
      compute: function (p) { var k = fits(p.vram); return k < 0 ? '--' : MODELS[k].acc + '%'; } },
    { id: 'j', label: { en: 'J per token', es: 'J por token' }, accent: 2,
      compute: function (p) { var k = fits(p.vram); return k < 0 ? '--' : MODELS[k].j.toFixed(3); } },
    { id: 'wh', label: { en: 'Wh per 1k tokens', es: 'Wh por 1k tokens' }, accent: 2,
      compute: function (p) { var k = fits(p.vram); return k < 0 ? '--' : MODELS[k].wh.toFixed(3); } }
  ],
  caption: {
    en: 'Each dot is one of the three Qwen2.5 models we measured: 0.5B on the left, which ' +
        'needs 0.99 GB; 1.5B in the middle at 3.09 GB; 3B on the right at 6.17 GB. The blue ' +
        'staircase is the best accuracy a budget of that many gigabytes can reach, the shaded ' +
        'strip is everything your machine can load, and the dashed amber line is your ceiling.\n\n' +
        '**Try this.** The slider starts at 4 GB, a common student laptop. At 4 GB the 3B model ' +
        'does not fit, so your ceiling is **70%** and every token costs **1.133 J**. Slide up to ' +
        '6.25 GB and the ceiling jumps to 95% while the energy per token rises to 1.941 J, about ' +
        '2.53 times what the 0.5B spends. Now slide down to 2 GB: the only model that loads scores ' +
        '15%. The question never changed. The hardware changed, and that is the whole argument.\n\n' +
        '**What these numbers do not count.** They are GPU board power only, one greedy run per ' +
        'model on one prompt, sampled about 50 times a second while the model was generating. No ' +
        'CPU, no RAM, no power supply losses, no cooling, no datacenter overhead. Read 0.767, ' +
        '1.133 and 1.941 J per token as a **lower bound** on local inference, not a total cost. ' +
        'The card also draws 13.8 W sitting idle against a 55 W limit, so part of every token is ' +
        'just the GPU being switched on. And the accuracy came from a 20 question bank, so treat ' +
        'those percentages as coarse: the ordering and the size of the steps are the finding, not ' +
        'the exact figure.',
    es: 'Cada punto es uno de los tres modelos Qwen2.5 que medimos: el 0.5B a la izquierda, que ' +
        'necesita 0.99 GB; el 1.5B en el medio con 3.09 GB; el 3B a la derecha con 6.17 GB. La ' +
        'escalera azul es la mejor exactitud que alcanza un presupuesto de esos gigabytes, la ' +
        'franja sombreada es todo lo que tu maquina puede cargar, y la linea ambar punteada es ' +
        'tu techo.\n\n' +
        '**Prueba esto.** El deslizador empieza en 4 GB, lo comun en una laptop de estudiante. Con ' +
        '4 GB el modelo 3B no cabe, asi que tu techo es **70%** y cada token cuesta **1.133 J**. ' +
        'Sube a 6.25 GB y el techo salta a 95%, mientras la energia por token sube a 1.941 J, unas ' +
        '2.53 veces lo que gasta el 0.5B. Ahora baja a 2 GB: el unico modelo que carga saca 15%. ' +
        'La pregunta nunca cambio. Cambio el hardware, y ese es todo el argumento.\n\n' +
        '**Lo que estos numeros no cuentan.** Son solo lecturas de potencia de la tarjeta grafica, ' +
        'una sola corrida por modelo con un solo mensaje, muestreada unas 50 veces por segundo ' +
        'mientras el modelo generaba. No incluyen el CPU, la memoria, las perdidas de la fuente, ' +
        'el enfriamiento ni la sobrecarga de un centro de datos. Lee 0.767, 1.133 y 1.941 J por ' +
        'token como una **cota inferior** de la inferencia local, no como el costo total. La ' +
        'tarjeta ademas consume 13.8 W en reposo frente a un limite de 55 W, asi que parte de cada ' +
        'token es simplemente tenerla encendida. Y la exactitud sale de un banco de 20 preguntas, ' +
        'asi que esos porcentajes son gruesos: el hallazgo es el orden y el tamano de los saltos, ' +
        'no la cifra exacta.'
  }
});
</script>
</body>
</html>
