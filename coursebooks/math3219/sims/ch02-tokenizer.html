<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Numbers all the way down: tokens</title>
<link rel="stylesheet" href="_engine.css">
</head>
<body>
<div id="sim"></div>
<script src="_engine.js"></script>
<script>
/* Real measurements, not a demo.

   Source: lab/we3_params_quant.py, PART 3 (WE-1). Tokenizer of
   Qwen/Qwen2.5-0.5B-Instruct, vocabulary 151,936 rows.
   The pieces are recorded in _research/00-lab-verified-findings.md section 3.
   The integer ids are printed by that script but were never written to a file
   in lab/out, so they were re-run offline from the cached tokenizer in
   lab/models on 19 September 2026, over that script's own input list:

     'cat'                          -> [4616]
     'cats'                         -> [37452]
     'Bakersfield'                  -> [33, 8312, 2566]
     'antidisestablishmentarianism' -> [517, 84242, 33400, 478, 8821, 2142]
     'ChatGPT'                      -> [15672, 38, 2828]
     '1234567'                      -> [16, 17, 18, 19, 20, 21, 22]
     '  spaces'                     -> [220, 12621]
     the Spanish question           -> [30182, 95897, 1788, 7061, 30]

   Nothing below is estimated and nothing below is hand-made. If you change a
   piece or an id here, re-run the tokenizer first.

   Non-ASCII text is written with \u escapes so this file stays ASCII on disk,
   matching _engine.js and the other sims. */

var TOKENIZATIONS = [
  { label: { en: 'cat', es: 'cat' },
    text: 'cat',
    pieces: ['cat'],
    ids: [4616] },

  { label: { en: 'cats', es: 'cats' },
    text: 'cats',
    pieces: ['cats'],
    ids: [37452] },

  { label: { en: 'Bakersfield', es: 'Bakersfield' },
    text: 'Bakersfield',
    pieces: ['B', 'akers', 'field'],
    ids: [33, 8312, 2566] },

  { label: { en: 'ChatGPT', es: 'ChatGPT' },
    text: 'ChatGPT',
    pieces: ['Chat', 'G', 'PT'],
    ids: [15672, 38, 2828] },

  { label: { en: 'a 28-letter word', es: 'palabra de 28 letras' },
    text: 'antidisestablishmentarianism',
    pieces: ['ant', 'idis', 'establish', 'ment', 'arian', 'ism'],
    ids: [517, 84242, 33400, 478, 8821, 2142] },

  { label: { en: '1234567', es: '1234567' },
    text: '1234567',
    pieces: ['1', '2', '3', '4', '5', '6', '7'],
    ids: [16, 17, 18, 19, 20, 21, 22] },

  { label: { en: 'two spaces', es: 'dos espacios' },
    text: '  spaces',
    pieces: [' ', ' spaces'],
    ids: [220, 12621] },

  { label: { en: 'a Spanish question', es: 'pregunta en espanol' },
    text: '\u00bfC\u00f3mo est\u00e1s?',
    pieces: ['\u00bf', 'C\u00f3mo', ' est', '\u00e1s', '?'],
    ids: [30182, 95897, 1788, 7061, 30] }
];

Sim.mount({
  type: 'tokens',
  title: {
    en: 'Bakersfield is three tokens, and every digit is a token of its own',
    es: 'Bakersfield son tres tokens, y cada digito es un token aparte'
  },
  examples: TOKENIZATIONS,
  caption: {
    en: 'A language model cannot read letters. Before anything else happens, your text ' +
        'is cut into pieces called **tokens**, and every piece is swapped for a whole ' +
        'number called its **token id**. That id is a row number in the vocabulary table ' +
        'of the model, and for Qwen2.5-0.5B-Instruct that table has **151,936** rows. ' +
        'Each chip ' +
        'above is one token. The small number on top of a chip is its position in the ' +
        'text: first, second, third. The number under a chip is its id. A chip that ' +
        'begins or ends with a space shows that space as a short underline, because the ' +
        'space is part of the token. Press a button to change the text.\n\n' +
        'Start with **cat**. One chip, id 4616. Now press **cats**. Still one chip, but ' +
        'the id is **37452**. The tokenizer did not take cat and add an s. The word cats ' +
        'has its own row in the table, and its number has nothing to do with 4616. This ' +
        'is worth slowing down for. **Token ids are labels, not quantities.** You cannot ' +
        'add them, average them, or say that 37452 is bigger than 4616 in any way that ' +
        'means anything. They are row numbers, like seat numbers in a theatre.\n\n' +
        'Now press **Bakersfield**. Three chips: B, akers and field, with ids 33, 8312 ' +
        'and 2566. The city this course is taught in does not get a row of its own. The ' +
        'vocabulary was built by counting which chunks of text show up often, and ' +
        'Bakersfield did not show up often enough, so the model spells it out of three ' +
        'chunks that did. **ChatGPT** goes the same way: Chat, G, PT. Length is not what ' +
        'decides this. The 28-letter word breaks into 6 pieces, while the 7-character ' +
        'string 1234567 breaks into 7. What decides it is how common each chunk was in ' +
        'the text the tokenizer was built from.\n\n' +
        '**1234567 is the one to sit with.** Seven characters, **seven tokens**, one per ' +
        'digit, with ids 16 through 22. The model never receives the number one million ' +
        'two hundred thirty-four thousand five hundred sixty-seven. It receives seven ' +
        'separate symbols in a row. Nothing in that row tells it which digit is in the ' +
        'hundreds place. To add two numbers by hand you line up the places and carry, ' +
        'and lining up the places is the whole job. A model that is handed digits as ' +
        'unrelated symbols has to work out place value for itself, from the order the ' +
        'symbols arrived in. **That is the mechanical reason these models are bad at ' +
        'arithmetic.** It is not a mystery about reasoning. It is the input.\n\n' +
        'Two more. Press **two spaces**. The text is two spaces followed by the word ' +
        'spaces, and it comes out as 2 tokens: a lone space with id 220, and then ' +
        'space-plus-spaces with id 12621. The space lives **inside** the second token. ' +
        'So the same six letters can be one token or two, depending only on what sits in ' +
        'front of them. Then press the Spanish question. It is 12 characters and 5 ' +
        'tokens, while Bakersfield is 11 characters and 3. One example is not a study of ' +
        'a language and this page will not pretend it is. It is a reason to check, ' +
        'because a service that bills by the token is billing by this count, and this ' +
        'count depends on which tokenizer read your text.\n\n' +
        '**What to carry forward.** A token is a piece of text with a number attached, ' +
        'and a list of those numbers is the whole view the model has of what you wrote. ' +
        'In chapter 3 you will find out that the table holding them is **27.56%** of ' +
        'all the parameters in this model, which is more than three times everything ' +
        'its attention machinery uses.',
    es: 'Un modelo de lenguaje no puede leer letras. Antes de cualquier otra cosa, tu ' +
        'texto se corta en pedazos llamados **tokens**, y cada pedazo se cambia por un ' +
        'numero entero llamado su **id de token**. Ese id es el numero de fila en la ' +
        'tabla de vocabulario del modelo, y para Qwen2.5-0.5B-Instruct esa tabla tiene ' +
        '**151,936** filas. Cada ficha de arriba es un token. El numero pequeno que esta ' +
        'arriba de una ficha es su posicion en el texto: primero, segundo, tercero. El ' +
        'numero de abajo es su id. Una ficha que empieza o termina con espacio muestra ' +
        'ese espacio como una rayita, porque el espacio es parte del token. Aprieta un ' +
        'boton para cambiar el texto.\n\n' +
        'Empieza con **cat**. Una ficha, id 4616. Ahora aprieta **cats**. Sigue siendo ' +
        'una ficha, pero el id es **37452**. El tokenizador no tomo cat y le agrego una ' +
        's. La palabra cats tiene su propia fila en la tabla, y su numero no tiene nada ' +
        'que ver con 4616. Vale la pena detenerse aqui. **Los ids de token son ' +
        'etiquetas, no cantidades.** No los puedes sumar, ni promediar, ni decir que ' +
        '37452 es mayor que 4616 de alguna manera que signifique algo. Son numeros de ' +
        'fila, como los numeros de asiento en un teatro.\n\n' +
        'Ahora aprieta **Bakersfield**. Tres fichas: B, akers y field, con los ids 33, ' +
        '8312 y 2566. La ciudad donde se da este curso no tiene fila propia. El ' +
        'vocabulario se armo contando que pedazos de texto aparecen seguido, y ' +
        'Bakersfield no aparecio lo suficiente, asi que el modelo lo deletrea con tres ' +
        'pedazos que si aparecieron. **ChatGPT** corre la misma suerte: Chat, G, PT. Lo ' +
        'que decide esto no es el largo. La palabra de 28 letras se parte en 6 pedazos, ' +
        'mientras que la cadena de 7 caracteres 1234567 se parte en 7. Lo que decide es ' +
        'que tan comun era cada pedazo en el texto con el que se armo el tokenizador.\n\n' +
        '**1234567 es el caso para pensar con calma.** Siete caracteres, **siete ' +
        'tokens**, uno por digito, con los ids del 16 al 22. El modelo nunca recibe el ' +
        'numero un millon doscientos treinta y cuatro mil quinientos sesenta y siete. ' +
        'Recibe siete simbolos sueltos en fila. Nada en esa fila le dice cual digito ' +
        'esta en las centenas. Para sumar dos numeros a mano alineas las posiciones y ' +
        'llevas, y alinear las posiciones es todo el trabajo. Un modelo que recibe los ' +
        'digitos como simbolos sueltos tiene que deducir el valor posicional por su ' +
        'cuenta, a partir del orden en que llegaron. **Esa es la razon mecanica por la ' +
        'que estos modelos son malos para la aritmetica.** No es un misterio sobre el ' +
        'razonamiento. Es la entrada.\n\n' +
        'Dos mas. Aprieta **dos espacios**. El texto son dos espacios seguidos de la ' +
        'palabra spaces, y sale como 2 tokens: un espacio solo con id 220, y luego ' +
        'espacio-mas-spaces con id 12621. El espacio vive **adentro** del segundo token. ' +
        'Asi que las mismas seis letras pueden ser un token o dos, dependiendo solo de ' +
        'lo que este delante. Despues aprieta la pregunta en espanol. Tiene 12 ' +
        'caracteres y 5 tokens, mientras que Bakersfield tiene 11 caracteres y 3. Un ' +
        'ejemplo no es un estudio de un idioma y esta pagina no va a fingir que lo es. ' +
        'Es una razon para revisar, porque un servicio que cobra por token esta cobrando ' +
        'por esta cuenta, y esta cuenta depende de cual tokenizador leyo tu texto.\n\n' +
        '**Que llevarte de aqui.** Un token es un pedazo de texto con un numero pegado, ' +
        'y una lista de esos numeros es toda la vista que el modelo tiene de lo que ' +
        'escribiste. En el capitulo 3 vas a ver que la tabla que los guarda es el ' +
        '**27.56%** de los parametros de este modelo, mas de tres veces todo lo que usa ' +
        'su maquinaria de atencion.'
  }
});
</script>
</body>
</html>
